<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Planner – Recipes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════ NAVBAR ══════════ -->
  <nav class="navbar">

    <a href="#" class="nav-logo" onclick="return false">
      <div class="logo-box">🥗</div>
      <span class="app-title">Meal Planner</span>
    </a>

    <ul class="nav-links">
      <li>
        <a href="#" class="nav-item" onclick="return false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Calendar
        </a>
      </li>
      <li>
        <a href="#" class="nav-item active" onclick="return false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          Recipes
        </a>
      </li>
    </ul>

    <div class="nav-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search recipes…" oninput="handleSearch(this.value)" />
    </div>

    <a href="#" class="nav-profile" onclick="return false" title="Profile">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </a>

  </nav>
  <!-- ══════════ END NAVBAR ══════════ -->


  <!-- ══════════ MAIN ══════════ -->
  <main class="page-content">

    <!-- Page header row -->
    <div class="page-header">
      <h1 class="page-title">Recipes &nbsp;<span class="title-accent">Favorites</span></h1>
      <button class="btn-add" onclick="openModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add
      </button>
    </div>

    <!-- Tag filter row -->
    <div class="filter-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
      </svg>
      <span class="filter-label">Filter by tags :</span>
      <div class="tag-pills">
        <button class="tag-pill active" data-tag="all"       onclick="filterTag(this)">Everything</button>
        <button class="tag-pill"        data-tag="breakfast" onclick="filterTag(this)">Breakfast</button>
        <button class="tag-pill"        data-tag="lunch"     onclick="filterTag(this)">Lunch</button>
        <button class="tag-pill"        data-tag="dinner"    onclick="filterTag(this)">Dinner</button>
        <button class="tag-pill"        data-tag="quick"     onclick="filterTag(this)">Quick</button>
        <button class="tag-pill"        data-tag="snack"     onclick="filterTag(this)">Etc.</button>
      </div>
    </div>

    <!-- Recipe card grid -->
    <div class="recipe-grid" id="recipe-grid"></div>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state" style="display:none">
      <span>🍽️</span>
      <p>No recipes here yet.</p>
      <button class="btn-add" onclick="openModal()">+ Add your first recipe</button>
    </div>

  </main>


  <!-- ══════════ ADD RECIPE MODAL ══════════ -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="backdropClick(event)" style="display:none">
    <div class="modal">

      <div class="modal-header">
        <h2>Add New Recipe</h2>
        <button class="modal-close" onclick="closeModal()">&#x2715;</button>
      </div>

      <form class="modal-body" onsubmit="submitRecipe(event)">

        <label class="form-label">Recipe Name <span class="required">*</span></label>
        <input class="form-input" id="f-name" type="text" placeholder="e.g. Avocado Toast" required />

        <label class="form-label">Image URL <span class="optional">(optional)</span></label>
        <input class="form-input" id="f-image" type="url" placeholder="https://…" />

        <label class="form-label">Source</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="source" value="personal" checked /> Personal</label>
          <label class="radio-label"><input type="radio" name="source" value="external" />  External</label>
        </div>

        <label class="form-label">Tags</label>
        <div class="checkbox-group">
          <label class="check-label"><input type="checkbox" value="breakfast" /> Breakfast</label>
          <label class="check-label"><input type="checkbox" value="lunch"     /> Lunch</label>
          <label class="check-label"><input type="checkbox" value="dinner"    /> Dinner</label>
          <label class="check-label"><input type="checkbox" value="quick"     /> Quick</label>
          <label class="check-label"><input type="checkbox" value="snack"     /> Snack</label>
        </div>

        <label class="form-label">Ingredients <span class="optional">(one per line)</span></label>
        <textarea class="form-input form-textarea" id="f-ingredients" rows="3" placeholder="e.g.&#10;2 slices sourdough bread&#10;1 ripe avocado&#10;1 pinch red pepper flakes"></textarea>

        <label class="form-label">Instructions <span class="optional">(one step per line)</span></label>
        <textarea class="form-input form-textarea" id="f-instructions" rows="3" placeholder="e.g.&#10;Toast bread until golden&#10;Mash avocado with salt and pepper&#10;Spread onto warm toast"></textarea>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-add">Save Recipe</button>
        </div>

      </form>
    </div>
  </div>
  <!-- ══════════ END MODAL ══════════ -->

  <!-- ══════════ RECIPE DETAIL MODAL ══════════ -->
  <div class="modal-backdrop" id="detail-backdrop" onclick="backdropDetailClick(event)" style="display:none">
    <div class="modal modal-detail">

      <div class="modal-header">
        <h2 id="d-name">Recipe Details</h2>
        <button class="modal-close" onclick="closeDetailModal()">&#x2715;</button>
      </div>

      <div class="modal-body detail-body" id="d-body">
        <!-- Rendered dynamically -->
      </div>

      <div class="modal-actions" style="padding: 0 1.4rem 1.25rem;">
        <button type="button" class="btn-secondary" onclick="closeDetailModal()">Close</button>
      </div>

    </div>
  </div>
  <!-- ══════════ END RECIPE DETAIL MODAL ══════════ -->

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
